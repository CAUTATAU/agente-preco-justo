name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Não chama o Bedrock: o modelo é criado só no primeiro pedido e a rota usa um agente falso nos testes
      - run: pytest -q
